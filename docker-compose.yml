services:
  bot:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./media:/app/media
      - ./backups:/app/backups:ro   # бот только читает дампы и шлёт копию в Telegram

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: realtor
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d realtor"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Ночной бэкап базы: раз в сутки после 03:00, проверка дампа, хранение 14 дней.
  # Ручной бэкап сейчас:   docker compose exec backup sh /backup.sh --once
  # Восстановление:        sh scripts/restore_backup.sh backups/<файл>.dump
  backup:
    image: postgres:16             # та же версия, что у db — pg_dump совместим
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: user
      PGPASSWORD: password
      PGDATABASE: realtor
      TZ: Asia/Tashkent
      BACKUP_HOUR: "3"
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
