[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
# E501 длина строк, B008 вызов в дефолте, UP042 (str, Enum) — осознанно оставляем
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
# данные примеров: dict(поле=…) читается проще литерала с кавычками
"bot/services/demo.py" = ["C408"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
